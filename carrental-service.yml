
server:
  port: 6607

spring:
  application:
    name: CARENTALS-SERVICE

  datasource:
    url: jdbc:mysql://localhost:3306/carrentalsdb
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8083/eureka/

  instance:
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: "*"

